<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Doomroom News</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <div class="kicker">GLOBAL BRIEFING</div>
          <h1>Doomroom News</h1>
          <div class="sub">Doom Index (Highly Scientific)</div>
        </div>

        <div class="actions">
          <button id="refreshBtn" class="btn primary">Refresh</button>
          <button id="aboutBtn" class="btn">About</button>
        </div>
      </header>

      <section class="card hero">
        <div class="heroGrid">
          <div class="heroScore">
            <div id="doomBig" class="doomBig">—</div>
            <div id="doomLabel" class="doomLabel">Loading…</div>

            <div class="doomTrack">
              <div id="doomFill" class="doomFill" style="width:0%"></div>
            </div>

            <div class="metaRow">
              <div id="statusPill" class="pill">Idle</div>
              <div id="updatedPill" class="pill muted">Updated: —</div>
            </div>

            <div class="metaRow">
              <div id="filterPill" class="pill muted">Filter: English / United States</div>
              <div id="samplePill" class="pill muted">Sample: — headlines</div>
            </div>
          </div>
        </div>
      </section>

      <section id="errorBox" class="card errorBox" style="display:none">
        <div class="errTitle">!! Error loading headlines.</div>
        <div id="errorText" class="muted"></div>
      </section>

      <section class="card">
        <div class="sectionTitle">DOOM BREAKDOWN</div>
        <div id="meters" class="meters"></div>
      </section>

      <section class="card">
        <div class="sectionTitle">TOP DRIVERS</div>
        <div id="drivers" class="drivers"></div>
      </section>

      <section class="card">
        <div class="sectionTitle">LATEST STORIES</div>
        <div id="stories" class="stories"></div>
      </section>

      <footer class="foot">
        <div id="version" class="muted"></div>
      </footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
